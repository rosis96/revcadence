[alembic]
script_location = migrations
# CRITICAL: lets migrations/env.py import the `app` package when the `alembic`
# binary runs from the repo root (Railway start command). Without this the
# deploy fails with ModuleNotFoundError: No module named 'app'.
prepend_sys_path = .
# URL comes from app.config (env DATABASE_URL) via migrations/env.py — do not set here.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
