<!doctype html>

  <head>
    <meta charset="UTF-8" />

    <!-- Cascade layer order, declared here because it has to be declared
         somewhere Tailwind will not rewrite. src/tailwind.css states the same
         order, but Tailwind v4 consumes that statement and re-emits its own —
         leaving the real order to fall out of which layer happens to appear
         first in the bundle. That works today and would break silently the day
         an import moves. The first declaration in the document wins, and this
         is it: `app` (styles.css) before `utilities`, so a Tailwind class beats
         the stylesheet it is meant to override. -->
    <style>@layer theme, base, vendor, app, components, utilities;</style>
    <script>
      try {
        const theme = localStorage.getItem("rc_theme") === "dark" ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
        document.documentElement.style.colorScheme = theme;
      } catch { /* Light remains the CSS default when storage is unavailable. */ }
    </script>
